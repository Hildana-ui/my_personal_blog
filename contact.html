<!doctype html>
<html lang="en">
<head>
  <script src="https://kit.fontawesome.com/0fb65af0ab.js" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Hildana.">
  <link rel="stylesheet" href="styles.css">
  <title>Hildana's Blog | Contact</title>
</head>
<body>
  <div class="page contact-page" id="top">
    <header class="site-header">
      <nav class="navbar container" aria-label="Primary navigation">
        <a class="brand" href="index.html"><img src="assets/taichilang.svg" alt="">Hildana's Blog</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a class="active" aria-current="page" href="contact.html">Contact</a></li>
          <li><a class="search-link" href="blog.html" aria-label="Browse blog posts">⌕</a></li>
        </ul>
      </nav>
    </header>

    <main class="site-main container contact-layout">
      <header class="contact-heading">
        <h1>Contact Me</h1>
        <p>I'd love to hear from you! Feel free to reach out.</p>
      </header>
      <section class="form-card" aria-label="Contact form">
        <form action="#top" method="get">
          <div class="form-group">
            <label for="name">Name *</label>
            <input class="form-control" type="text" name="name" id="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input class="form-control" type="email" name="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <select class="form-control" name="subject" id="subject">
              <option value="">Select a subject</option>
              <option>Technology</option>
              <option>Lifestyle</option>
              <option>Art</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Message *</label>
            <textarea class="form-control" name="message" id="message" placeholder="Your message..." required></textarea>
          </div>
          <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
        </form>
      </section>
      <section class="connect-card" aria-labelledby="connect-title">
        <h2 id="connect-title">Connect With Me</h2>
        <p>Find me on these platforms:</p>
        <nav class="social-links" aria-label="Contact links">
          <a href="#top"><span class="social-icon" aria-hidden="true"><i class="fa-brands fa-github"></i></span>GitHub</a>
          <a href="#top"><span class="social-icon" aria-hidden="true"><i class="fa-brands fa-linkedin-in"></i></span>LinkedIn</a>
          <a href="#top"><span class="social-icon" aria-hidden="true"><i class="fa-brands fa-youtube"></i></span>YouTube</a>
          <a href="mailto:hello@example.com"><span class="social-icon" aria-hidden="true"><i class="fa-regular fa-envelope"></i></span>Email Me</a>
        </nav>
      </section>
    </main>
    <img class="contact-illustration" src="assets/illustration.png" alt="">

    <footer class="site-footer">
      <div class="footer-inner container">
        <p>© 2026 Hildana's Blog. All rights reserved.</p>
        <nav class="footer-socials" aria-label="Social links">
          <a href="#top" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
          <a href="#top" aria-label="LinkedIn"><i class="fa-brands fa-square-linkedin"></i></a>
          <a href="#top" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
          <a href="#top" aria-label="Email"><i class="fa-regular fa-envelope"></i></a>
        </nav>
      </div>
    </footer>
  </div>
</body>
</html>
